[package]
name = "system-info"
version = "2.6.1"
description = "System Info — native desktop shell"
authors = ["Vipul Sharma"]
edition = "2021"
# Kept in lockstep with the rest of the app (frontend/package.json,
# tauri.conf.json, Directory.Build.props) — see scripts/sync-version.mjs.
# Do not bump this by hand; run the sync script instead.

[lib]
# Allows `cargo build` from this crate to also be exercised by tests/tools
# without going through the Tauri CLI. Not required for `tauri build`, but
# harmless and standard for Tauri 2 projects.
name = "system_info_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Only the bare `tauri` crate — deliberately NOT tauri-plugin-shell. The
# frontend never gets shell/command-execution capabilities (spec section 23):
# process spawning happens entirely in Rust (src/process.rs, src/supervisor.rs), invoked
# only through the narrow, purpose-built `start_services`/`stop_services`/
# `exit_app` commands below. There is nothing for a capabilities file to
# accidentally over-grant.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Readiness probes are a single loopback GET done with std::net in
# src/supervisor.rs, so no HTTP client crate is needed.
# In-app updates. tauri-plugin-updater downloads the signed installer that
# CI attaches to each GitHub Release (see latest.json, produced by
# scripts/make-update-manifest.mjs), verifies its minisign signature against
# the public key in tauri.conf.json, and installs it (NSIS on Windows,
# AppImage swap or `pkexec dpkg -i` on Linux). tauri-plugin-process only
# provides relaunch() so the app can restart itself after an update. Keep
# both on the same major.minor as their @tauri-apps/plugin-* npm twins —
# `tauri build` refuses mismatched pairs, which is why Cargo.lock is committed.
tauri-plugin-updater = "2.12"
tauri-plugin-process = "2.3"

# Release builds optimise for a small, quiet shell: whole-program optimisation, one codegen unit, stripped symbols,
# size-oriented code and abort-on-panic (no unwinding tables). The shell only supervises a child process and hosts a webview.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
# This feature is used for production builds where `devPath` points to the
# static frontend assets instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
# Safe wrapper around Win32 Job Objects — see src/process.rs's module docs
# for why this (not just Child::kill()) is what actually closes the orphan-
# process hole the migration spec calls out (section 21). Widely used for
# exactly this "guarantee no leaked subprocesses" problem.
win32job = "2"
