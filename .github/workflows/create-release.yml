name: Create Release

on:
  workflow_run:
    workflows:
      - "Create Release Tag"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: create-release-main
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -e

          VERSION=$(grep -m 1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md || true)

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to determine release version from CHANGELOG.md."
            exit 1
          fi

          TAG="$VERSION"

          echo "Version: $VERSION"
          echo "Tag: $TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        id: tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e

          git fetch --tags origin

          TAG_SHA=$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')

          if [ -z "$TAG_SHA" ]; then
            echo "::error::Release tag $TAG does not exist."
            exit 1
          fi

          echo "Release tag: $TAG"
          echo "Release commit: $TAG_SHA"

          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify tag points to current main
        shell: bash
        env:
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -e

          git fetch origin main

          MAIN_SHA=$(git rev-parse origin/main)

          echo "Tag commit: $TAG_SHA"
          echo "Main commit: $MAIN_SHA"

          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Release tag does not point to current main."
            exit 1
          fi

      - name: Find successful installer builds
        id: builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -e

          WINDOWS_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-windows-installer.yml/runs?branch=main&per_page=50")

          LINUX_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-linux-installer.yml/runs?branch=main&per_page=50")

          WINDOWS_RUN_ID=$(echo "$WINDOWS_JSON" | jq -r \
            --arg sha "$TARGET_SHA" \
            '.workflow_runs[] |
             select(.head_sha == $sha and .conclusion == "success") |
             .id' |
            head -n 1)

          LINUX_RUN_ID=$(echo "$LINUX_JSON" | jq -r \
            --arg sha "$TARGET_SHA" \
            '.workflow_runs[] |
             select(.head_sha == $sha and .conclusion == "success") |
             .id' |
            head -n 1)

          if [ -z "$WINDOWS_RUN_ID" ]; then
            echo "::error::Successful Windows build not found for $TARGET_SHA."
            exit 1
          fi

          if [ -z "$LINUX_RUN_ID" ]; then
            echo "::error::Successful Linux build not found for $TARGET_SHA."
            exit 1
          fi

          echo "Windows build: $WINDOWS_RUN_ID"
          echo "Linux build: $LINUX_RUN_ID"

          echo "windows_run_id=$WINDOWS_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "linux_run_id=$LINUX_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check existing GitHub release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."

            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub release $TAG does not exist."

            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows installer artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-Setup
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ steps.builds.outputs.windows_run_id }}

      - name: Download Linux AppImage artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-AppImage
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ steps.builds.outputs.linux_run_id }}

      - name: Download Linux deb artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-deb
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ steps.builds.outputs.linux_run_id }}

      - name: Prepare release assets
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -e

          mkdir -p release-assets-final

          find release-assets \
            -type f \
            -maxdepth 3 \
            -print

          WINDOWS_EXE=$(find release-assets \
            -type f \
            -name "SystemInfo-Setup.exe" |
            head -n 1)

          APPIMAGE=$(find release-assets \
            -type f \
            -name "*.AppImage" |
            head -n 1)

          DEB=$(find release-assets \
            -type f \
            -name "*.deb" |
            head -n 1)

          if [ -z "$WINDOWS_EXE" ]; then
            echo "::error::Windows installer was not found."
            exit 1
          fi

          if [ -z "$APPIMAGE" ]; then
            echo "::error::Linux AppImage was not found."
            exit 1
          fi

          if [ -z "$DEB" ]; then
            echo "::error::Linux .deb package was not found."
            exit 1
          fi

          cp "$WINDOWS_EXE" release-assets-final/
          cp "$APPIMAGE" release-assets-final/
          cp "$DEB" release-assets-final/

          echo ""
          echo "Release assets:"
          ls -lah release-assets-final/

      - name: Prepare release notes
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {
              found=1
              print
              next
            }

            found && /^## \[/ {
              exit
            }

            found {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "SystemInfo $VERSION" > release-notes.md
            echo "" >> release-notes.md
            echo "Release $VERSION." >> release-notes.md
          fi

          echo ""
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SystemInfo ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            release-assets-final/SystemInfo-Setup.exe
            release-assets-final/*.AppImage
            release-assets-final/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e

          gh release view "$TAG"

          echo ""
          echo "============================================"
          echo " GITHUB RELEASE CREATED / VERIFIED"
          echo "============================================"
          echo "Release: $TAG"
          echo "============================================"