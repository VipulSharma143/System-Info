name: Create Release

# Fires whenever EITHER build workflow finishes — but only actually creates
# a release once BOTH have a successful run recorded for the same commit.
# This is the fail-safe: if either build fails, no release is ever created,
# no matter how many times this workflow itself runs.

on:
  workflow_run:
    workflows:
      - "Build Windows Installer"
      - "Build Linux Installer"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: create-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate-and-release:
    runs-on: ubuntu-latest

    # Only proceed at all if THIS run succeeded and came from a tag push.
    # (A failed run here means one build failed — nothing further happens,
    # which is exactly the point: no release gets created.)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:

      # ============================================================
      # CHECK OUT THE EXACT COMMIT THAT WAS BUILT
      # ============================================================

      - name: Check out the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0


      # ============================================================
      # CHECK WHETHER BOTH BUILDS HAVE SUCCEEDED FOR THIS COMMIT
      #
      # Queries both workflows' run history filtered to this exact SHA.
      # Only counts a workflow as "passed" if it has a completed,
      # successful run for THIS commit — an old success from a
      # different commit never counts.
      # ============================================================

      - name: Check both builds succeeded
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e

          check_workflow_success() {
            local workflow_name="$1"
            gh api "repos/${{ github.repository }}/actions/runs" \
              --paginate \
              -q ".workflow_runs[] | select(.name==\"$workflow_name\" and .head_sha==\"$SHA\" and .conclusion==\"success\") | .id" \
              | head -n 1
          }

          WINDOWS_RUN_ID=$(check_workflow_success "Build Windows Installer")
          LINUX_RUN_ID=$(check_workflow_success "Build Linux Installer")

          echo "Windows run for $SHA: ${WINDOWS_RUN_ID:-none}"
          echo "Linux run for $SHA:   ${LINUX_RUN_ID:-none}"

          if [ -z "$WINDOWS_RUN_ID" ] || [ -z "$LINUX_RUN_ID" ]; then
            echo "Not both builds have succeeded yet for this commit — nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Both builds succeeded — proceeding to release."
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "windows_run_id=$WINDOWS_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "linux_run_id=$LINUX_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check release doesn't already exist
        if: steps.gate.outputs.ready == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.workflow_run.head_branch }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — this is the second (redundant) trigger, skipping."
            echo "should_create=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_create=true" >> "$GITHUB_OUTPUT"
          fi


      # ============================================================
      # DOWNLOAD ARTIFACTS FROM BOTH SUCCESSFUL RUNS
      # ============================================================

      - name: Download Windows installer artifact
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.should_create == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-Setup
          run-id: ${{ steps.gate.outputs.windows_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Download AppImage artifact
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.should_create == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-AppImage
          run-id: ${{ steps.gate.outputs.linux_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Download .deb artifact
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.should_create == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-deb
          run-id: ${{ steps.gate.outputs.linux_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets


      # ============================================================
      # PREPARE RELEASE NOTES FROM CHANGELOG
      # ============================================================

      - name: Prepare release notes from CHANGELOG
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.should_create == 'true'
        run: |
          set -e
          TAG="${{ github.event.workflow_run.head_branch }}"
          VERSION="${TAG#v}"
          ESCAPED_VERSION=$(printf '%s\n' "$VERSION" | sed 's/[.[\*^$]/\\&/g')

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md was not found."
            exit 1
          fi

          NOTES=$(awk "/^## \[${ESCAPED_VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)

          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::Could not find [$VERSION] in CHANGELOG.md."
            exit 1
          fi

          echo "$NOTES" > release-notes.md


      # ============================================================
      # CREATE THE RELEASE — ONLY REACHED IF BOTH BUILDS PASSED
      # ============================================================

      - name: Create GitHub Release
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.should_create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          name: "SystemInfo ${{ github.event.workflow_run.head_branch }}"
          body_path: release-notes.md
          files: release-assets/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
