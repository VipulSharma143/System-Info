name: Create Release

on:
  workflow_run:
    workflows:
      - "Create Release Tag"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find release version
        id: version
        shell: bash
        run: |
          set -e

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md was not found."
            exit 1
          fi

          VERSION=$(grep -m 1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not find a release version in CHANGELOG.md."
            echo "Expected format:"
            echo "## [1.0.3] - 2026-09-13"
            exit 1
          fi

          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -e

          TAG="$VERSION"

          echo "Checking release tag: $TAG"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG does not exist on origin."
            exit 1
          fi

          echo "Verified: tag $TAG exists."

      - name: Determine release commit
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -e

          TAG="$VERSION"

          SHA=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')

          if [ -z "$SHA" ]; then
            echo "::error::Could not determine commit for tag $TAG."
            exit 1
          fi

          echo "Release tag: $TAG"
          echo "Release commit: $SHA"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Check successful Windows and Linux builds
        id: builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -e

          echo "Looking for successful builds for:"
          echo "$SHA"
          echo ""

          get_successful_run() {
            local workflow_name="$1"

            gh api \
              "repos/${{ github.repository }}/actions/runs" \
              --paginate \
              -q ".workflow_runs[] | select(
                    .name == \"$workflow_name\" and
                    .head_sha == \"$SHA\" and
                    .conclusion == \"success\"
                  ) | .id" \
              | head -n 1
          }

          WINDOWS_RUN_ID=$(get_successful_run "Build Windows Installer")
          LINUX_RUN_ID=$(get_successful_run "Build Linux Installer")

          echo "Windows run: ${WINDOWS_RUN_ID:-not found}"
          echo "Linux run:   ${LINUX_RUN_ID:-not found}"
          echo ""

          if [ -z "$WINDOWS_RUN_ID" ]; then
            echo "::error::No successful Windows build found for $SHA."
            exit 1
          fi

          if [ -z "$LINUX_RUN_ID" ]; then
            echo "::error::No successful Linux build found for $SHA."
            exit 1
          fi

          echo "Both builds verified."

          echo "windows_run_id=$WINDOWS_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "linux_run_id=$LINUX_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -e

          TAG="$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "Nothing else needs to be created."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist."
            echo "A new release will be created."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows installer
        if: steps.existing.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-Setup
          run-id: ${{ steps.builds.outputs.windows_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets/windows

      - name: Download Linux AppImage
        if: steps.existing.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-AppImage
          run-id: ${{ steps.builds.outputs.linux_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets/linux

      - name: Download Linux deb
        if: steps.existing.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-deb
          run-id: ${{ steps.builds.outputs.linux_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets/linux

      - name: Verify release assets
        if: steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -e

          echo "Release assets:"
          find release-assets -type f -print

          if ! find release-assets -type f | grep -q .; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

      - name: Prepare release notes
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -e

          ESCAPED_VERSION=$(printf '%s\n' "$VERSION" | sed 's/[.[\*^$]/\\&/g')

          NOTES=$(awk \
            "/^## \[${ESCAPED_VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" \
            CHANGELOG.md)

          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            echo "::error::Could not find release notes for [$VERSION]."
            exit 1
          fi

          printf '%s\n' "$NOTES" > release-notes.md

          echo "Release notes prepared for $VERSION."

      - name: Create GitHub Release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "SystemInfo ${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: release-assets/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -e

          gh release view "$VERSION"

          echo ""
          echo "============================================"
          echo " GITHUB RELEASE CREATED SUCCESSFULLY"
          echo "============================================"
          echo "Version: $VERSION"
          echo "============================================"
