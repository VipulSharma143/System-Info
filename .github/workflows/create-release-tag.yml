name: Create Release Tag

on:
  workflow_run:
    workflows:
      - "Build Windows Installer"
      - "Build Linux Installer"
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: create-release-tag-main
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Determine release commit
        id: commit
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e

          if [ -n "$WORKFLOW_SHA" ]; then
            SHA="$WORKFLOW_SHA"
          else
            SHA="$(git rev-parse origin/main)"
          fi

          echo "Release candidate commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -e

          VERSION=$(grep -m 1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md || true)

          if [ -z "$VERSION" ]; then
            echo "::error::Unable to determine release version from CHANGELOG.md."
            exit 1
          fi

          TAG="$VERSION"

          echo "Release version: $VERSION"
          echo "Release tag: $TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for both installer builds
        id: builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -e

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=30

          WINDOWS_WORKFLOW="Build Windows Installer"
          LINUX_WORKFLOW="Build Linux Installer"

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            echo ""
            echo "============================================"
            echo " Checking installer builds"
            echo " Attempt $attempt/$MAX_ATTEMPTS"
            echo " Commit: $TARGET_SHA"
            echo "============================================"

            WINDOWS_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-windows-installer.yml/runs?branch=main&event=push&per_page=20")

            LINUX_JSON=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/build-linux-installer.yml/runs?branch=main&per_page=20")

            WINDOWS_STATUS=$(echo "$WINDOWS_JSON" | jq -r \
              --arg sha "$TARGET_SHA" \
              '.workflow_runs[] | select(.head_sha == $sha) | .status' |
              head -n 1)

            WINDOWS_CONCLUSION=$(echo "$WINDOWS_JSON" | jq -r \
              --arg sha "$TARGET_SHA" \
              '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' |
              head -n 1)

            WINDOWS_ID=$(echo "$WINDOWS_JSON" | jq -r \
              --arg sha "$TARGET_SHA" \
              '.workflow_runs[] | select(.head_sha == $sha) | .id' |
              head -n 1)

            LINUX_STATUS=$(echo "$LINUX_JSON" | jq -r \
              --arg sha "$TARGET_SHA" \
              '.workflow_runs[] | select(.head_sha == $sha) | .status' |
              head -n 1)

            LINUX_CONCLUSION=$(echo "$LINUX_JSON" | jq -r \
              --arg sha "$TARGET_SHA" \
              '.workflow_runs[] | select(.head_sha == $sha) | .conclusion' |
              head -n 1)

            LINUX_ID=$(echo "$LINUX_JSON" | jq -r \
              --arg sha "$TARGET_SHA" \
              '.workflow_runs[] | select(.head_sha == $sha) | .id' |
              head -n 1)

            echo ""
            echo "Windows:"
            echo "  Run ID: ${WINDOWS_ID:-not-found}"
            echo "  Status: ${WINDOWS_STATUS:-not-found}"
            echo "  Conclusion: ${WINDOWS_CONCLUSION:-not-found}"

            echo ""
            echo "Linux:"
            echo "  Run ID: ${LINUX_ID:-not-found}"
            echo "  Status: ${LINUX_STATUS:-not-found}"
            echo "  Conclusion: ${LINUX_CONCLUSION:-not-found}"

            if [[ "$WINDOWS_CONCLUSION" == "failure" ||
                  "$WINDOWS_CONCLUSION" == "cancelled" ||
                  "$WINDOWS_CONCLUSION" == "timed_out" ]]; then
              echo "::error::Windows installer build failed."
              exit 1
            fi

            if [[ "$LINUX_CONCLUSION" == "failure" ||
                  "$LINUX_CONCLUSION" == "cancelled" ||
                  "$LINUX_CONCLUSION" == "timed_out" ]]; then
              echo "::error::Linux installer build failed."
              exit 1
            fi

            if [[ "$WINDOWS_CONCLUSION" == "success" &&
                  "$LINUX_CONCLUSION" == "success" ]]; then

              echo ""
              echo "Both installer builds completed successfully."

              echo "windows_run_id=$WINDOWS_ID" >> "$GITHUB_OUTPUT"
              echo "linux_run_id=$LINUX_ID" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo ""
              echo "One or both builds are not finished yet."
              echo "Waiting ${SLEEP_SECONDS} seconds..."

              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "::error::Timed out waiting for both installer builds."
          exit 1

      - name: Verify release commit is current main
        shell: bash
        env:
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -e

          git fetch origin main

          MAIN_SHA=$(git rev-parse origin/main)

          echo "Target SHA: $TARGET_SHA"
          echo "Current main SHA: $MAIN_SHA"

          if [ "$TARGET_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Release candidate is not the current main commit."
            exit 1
          fi

      - name: Check existing release tag
        id: existing
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -e

          echo "Checking whether tag $TAG already exists..."

          # First check for an annotated tag and dereference it to its
          # target commit.
          TAG_SHA=$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')

          # If no dereferenced target exists, check for a lightweight tag.
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          fi

          if [ -z "$TAG_SHA" ]; then
            echo "Tag $TAG does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Existing tag $TAG points to:"
          echo "$TAG_SHA"

          echo "Expected commit:"
          echo "$TARGET_SHA"

          if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
            echo "::error::Tag $TAG already exists but points to a different commit."
            echo "::error::Existing: $TAG_SHA"
            echo "::error::Expected: $TARGET_SHA"
            exit 1
          fi

          echo ""
          echo "Tag already points to the correct commit."

          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -e

          echo "Creating annotated tag $TAG at $TARGET_SHA..."

          git tag -a "$TAG" "$TARGET_SHA" -m "Release $TAG"

          git push origin "$TAG"

          echo "Tag created successfully."

      - name: Verify release tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -e

          git fetch --tags origin

          echo "Verifying release tag $TAG..."

          # Prefer annotated-tag dereferencing.
          TAG_SHA=$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')

          # Fall back to the direct tag reference so existing lightweight
          # tags, such as the current 1.0.4 tag, are also supported.
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          fi

          echo ""
          echo "Remote tag target:"
          echo "$TAG_SHA"

          echo "Expected target:"
          echo "$TARGET_SHA"

          if [ -z "$TAG_SHA" ]; then
            echo "::error::Release tag $TAG could not be found on origin."
            exit 1
          fi

          if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
            echo "::error::Release tag verification failed."
            echo "::error::Tag: $TAG"
            echo "::error::Remote: $TAG_SHA"
            echo "::error::Expected: $TARGET_SHA"
            exit 1
          fi

          echo ""
          echo "============================================"
          echo " RELEASE TAG CREATED / VERIFIED"
          echo "============================================"
          echo "Tag: $TAG"
          echo "Commit: $TARGET_SHA"
          echo "============================================"