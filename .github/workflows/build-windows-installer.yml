name: Build Windows Installer

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install nasm -y

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install innosetup -y

      - name: Build native C++ engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring CMake..."

          cmake -B native/build `
            -A x64 `
            native

          Write-Host "Building native C++ engine..."

          cmake --build native/build `
            --config Release `
            --parallel

          Write-Host "Searching for systemmonitor_native.dll..."

          $dll = Get-ChildItem `
            -Path "native/build" `
            -Recurse `
            -Filter "systemmonitor_native.dll" |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "systemmonitor_native.dll was not produced by the build."
            exit 1
          }

          Write-Host "Found native DLL:"
          Write-Host $dll.FullName

          $destination = "backend/SystemMonitor.Api/systemmonitor_native.dll"

          Copy-Item `
            -Path $dll.FullName `
            -Destination $destination `
            -Force

          Write-Host "Copied native DLL to:"
          Write-Host $destination

      - name: Restore and build .NET backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Restoring .NET backend..."

          dotnet restore backend/SystemMonitor.Api

          Write-Host "Building .NET backend..."

          dotnet build backend/SystemMonitor.Api `
            --configuration Release `
            --no-restore

      - name: Install frontend dependencies and build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "package-lock.json") {
            Write-Host "package-lock.json found. Using npm ci..."
            npm ci
          }
          else {
            Write-Host "package-lock.json not found. Using npm install..."
            npm install
          }

          Write-Host "Building frontend..."

          npm run build

      - name: Install Python analytics dependencies
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            Write-Host "Installing dependencies from analytics/requirements.txt..."

            python -m pip install -r requirements.txt
          }
          else {
            Write-Host "analytics/requirements.txt not found."

            python -m pip install `
              fastapi `
              uvicorn `
              pymongo
          }

      - name: Verify required build files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            ".\start-all.ps1",
            ".\setup.ps1",
            ".\SystemInfo.iss",
            ".\SystemInfo.ico"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "Required file was not found: $file"
              exit 1
            }

            Write-Host "Found: $file"
          }

      - name: Build SystemInfo.exe from start-all.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing ps2exe..."

          Install-Module `
            ps2exe `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

          Write-Host "Building SystemInfo.exe..."

          Invoke-ps2exe `
            .\start-all.ps1 `
            .\SystemInfo.exe `
            -iconFile .\SystemInfo.ico `
            -noConsole `
            -title "SystemInfo"

          if (-not (Test-Path ".\SystemInfo.exe")) {
            Write-Error "SystemInfo.exe was not created."
            exit 1
          }

          Write-Host "SystemInfo.exe created successfully."

          $exe = Get-Item ".\SystemInfo.exe"

          Write-Host "EXE size: $($exe.Length) bytes"

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler was not found:"
            Write-Error $iscc
            exit 1
          }

          if (-not (Test-Path ".\SystemInfo.iss")) {
            Write-Error "SystemInfo.iss was not found."
            exit 1
          }

          Write-Host "Compiling installer..."

          & $iscc ".\SystemInfo.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

          Write-Host "Inno Setup completed successfully."

      - name: Verify installer exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "Output/SystemInfo-Setup.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Output/SystemInfo-Setup.exe was not created."

            Write-Host ""
            Write-Host "Searching for generated EXE files..."

            Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter "*.exe" |
              Select-Object FullName, Length

            exit 1
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "============================================"
          Write-Host " WINDOWS INSTALLER CREATED SUCCESSFULLY"
          Write-Host "============================================"
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "============================================"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-Setup
          path: Output/SystemInfo-Setup.exe
          if-no-files-found: error
          retention-days: 30