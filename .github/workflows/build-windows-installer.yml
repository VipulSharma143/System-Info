name: build-windows-installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NASM
        run: choco install nasm -y

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build native C++ engine
        run: |
          cmake -B native/build -A x64 native
          cmake --build native/build --config Release

          $dll = Get-ChildItem -Recurse -Filter "systemmonitor_native.dll" -Path "native/build" |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "systemmonitor_native.dll was not produced by the build."
            exit 1
          }

          Copy-Item $dll.FullName -Destination "backend/SystemMonitor.Api/"
        shell: pwsh

      - name: Restore and build .NET backend
        run: |
          dotnet restore backend/SystemMonitor.Api
          dotnet build backend/SystemMonitor.Api --configuration Release --no-restore
        shell: pwsh

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm install
          npm run build
        shell: pwsh

      - name: Install Python analytics dependencies
        working-directory: analytics
        run: pip install fastapi uvicorn pymongo
        shell: pwsh

      - name: Build SystemInfo.exe from start-all.ps1
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe .\start-all.ps1 .\SystemInfo.exe `
            -iconFile .\SystemInfo.ico `
            -noConsole `
            -title "SystemInfo"
        shell: pwsh

      - name: Compile installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" SystemInfo.iss
        shell: pwsh

      - name: Verify installer exists
        run: |
          if (-not (Test-Path "Output/SystemInfo-Setup.exe")) {
            Write-Error "Output/SystemInfo-Setup.exe was not created."
            Write-Host "EXE files found:"
            Get-ChildItem -Path . -Recurse -Filter *.exe |
              Select-Object FullName, Length
            exit 1
          }

          $file = Get-Item "Output/SystemInfo-Setup.exe"
          Write-Host "Installer created successfully:"
          Write-Host $file.FullName
          Write-Host "Size: $($file.Length) bytes"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "SystemInfo Build ${{ github.run_number }}"
          generate_release_notes: true
          files: Output/SystemInfo-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
