name: Build Windows Installer

on:
  push:
    branches:
      - main

    # Version tags create official GitHub Releases.
    # Examples:
    # v1.0.1
    # v1.0.2
    # v1.1.0
    tags:
      - "v*.*.*"

  # Allows manual builds from GitHub Actions.
  workflow_dispatch:

# Required for creating GitHub Releases.
permissions:
  contents: write

# Prevent multiple unnecessary builds for the same ref.
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ============================================================
      # CHECK OUT REPOSITORY
      # ============================================================

      - name: Check out the repo
        uses: actions/checkout@v5


      # ============================================================
      # .NET
      # ============================================================

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"


      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"


      # ============================================================
      # PYTHON
      #
      # No cache dependency is specified because the repository
      # does not require analytics/requirements.txt to exist.
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # BUILD TOOLS
      # ============================================================

      - name: Install NASM
        run: choco install nasm -y

      - name: Install Inno Setup
        run: choco install innosetup -y


      # ============================================================
      # BUILD NATIVE C++ ENGINE
      # ============================================================

      - name: Build native C++ engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring CMake..."

          cmake -B native/build -A x64 native

          Write-Host "Building native C++ engine..."

          cmake --build native/build `
            --config Release `
            --parallel

          Write-Host "Searching for systemmonitor_native.dll..."

          $dll = Get-ChildItem `
            -Path "native/build" `
            -Recurse `
            -Filter "systemmonitor_native.dll" |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "systemmonitor_native.dll was not produced by the build."
            exit 1
          }

          Write-Host "Found native DLL:"
          Write-Host $dll.FullName

          $destination = "backend/SystemMonitor.Api/systemmonitor_native.dll"

          Copy-Item `
            -Path $dll.FullName `
            -Destination $destination `
            -Force

          Write-Host "Copied native DLL to:"
          Write-Host $destination


      # ============================================================
      # BUILD .NET BACKEND
      # ============================================================

      - name: Restore and build .NET backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore backend/SystemMonitor.Api

          dotnet build backend/SystemMonitor.Api `
            --configuration Release `
            --no-restore


      # ============================================================
      # BUILD FRONTEND
      # ============================================================

      - name: Install frontend dependencies and build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "package-lock.json") {
            Write-Host "package-lock.json found. Using npm ci..."
            npm ci
          }
          else {
            Write-Host "package-lock.json not found. Using npm install..."
            npm install
          }

          npm run build


      # ============================================================
      # PYTHON ANALYTICS
      # ============================================================

      - name: Install Python analytics dependencies
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            Write-Host "Installing dependencies from analytics/requirements.txt..."

            python -m pip install -r requirements.txt
          }
          else {
            Write-Host "analytics/requirements.txt not found."
            Write-Host "Installing required Python dependencies..."

            python -m pip install fastapi uvicorn pymongo
          }


      # ============================================================
      # BUILD SystemInfo.exe
      # ============================================================

      - name: Build SystemInfo.exe from start-all.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path ".\start-all.ps1")) {
            Write-Error "start-all.ps1 was not found."
            exit 1
          }

          if (-not (Test-Path ".\SystemInfo.ico")) {
            Write-Error "SystemInfo.ico was not found."
            exit 1
          }

          Write-Host "Installing ps2exe..."

          Install-Module `
            ps2exe `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

          Write-Host "Building SystemInfo.exe..."

          Invoke-ps2exe `
            .\start-all.ps1 `
            .\SystemInfo.exe `
            -iconFile .\SystemInfo.ico `
            -noConsole `
            -title "SystemInfo"

          if (-not (Test-Path ".\SystemInfo.exe")) {
            Write-Error "SystemInfo.exe was not created."
            exit 1
          }

          Write-Host "SystemInfo.exe created successfully."


      # ============================================================
      # COMPILE INSTALLER WITH INNO SETUP
      # ============================================================

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler was not found:"
            Write-Error $iscc
            exit 1
          }

          if (-not (Test-Path ".\SystemInfo.iss")) {
            Write-Error "SystemInfo.iss was not found."
            exit 1
          }

          Write-Host "Compiling installer..."

          & $iscc ".\SystemInfo.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }


      # ============================================================
      # VERIFY INSTALLER
      # ============================================================

      - name: Verify installer exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "Output/SystemInfo-Setup.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Output/SystemInfo-Setup.exe was not created."

            Write-Host ""
            Write-Host "Searching for EXE files..."

            Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter "*.exe" |
              Select-Object FullName, Length

            exit 1
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "============================================"
          Write-Host " WINDOWS INSTALLER CREATED SUCCESSFULLY"
          Write-Host "============================================"
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "============================================"


      # ============================================================
      # UPLOAD ACTIONS ARTIFACT
      #
      # Every successful build gets an Actions artifact.
      #
      # Normal main push:
      #   Actions -> Artifacts
      #
      # Version tag:
      #   Actions -> Artifacts
      #   AND GitHub Release
      # ============================================================

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-Setup
          path: Output/SystemInfo-Setup.exe
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # PREPARE RELEASE NOTES FROM CHANGELOG
      #
      # IMPORTANT:
      #
      # Git tag:
      #     v1.0.2
      #
      # CHANGELOG:
      #     ## [1.0.2] - 2026-09-20
      #
      # The "v" is removed before searching CHANGELOG.md.
      #
      # ONLY the matching version section is included.
      # ============================================================

      - name: Prepare release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tagVersion = "${{ github.ref_name }}"

          # Convert v1.0.2 -> 1.0.2
          $version = $tagVersion -replace '^v', ''

          Write-Host "Git tag: $tagVersion"
          Write-Host "CHANGELOG version: $version"

          if (-not (Test-Path "CHANGELOG.md")) {
            Write-Error "CHANGELOG.md was not found."
            exit 1
          }

          $changelog = Get-Content `
            "CHANGELOG.md" `
            -Raw

          $escapedVersion = [regex]::Escape($version)

          # Find:
          #
          # ## [1.0.2] - 2026-09-20
          #
          # and stop before:
          #
          # ## [1.0.1]
          #
          # or the end of the file.

          $pattern = "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)"

          $match = [regex]::Match(
            $changelog,
            $pattern
          )

          if (-not $match.Success) {
            Write-Error "Could not find [$version] in CHANGELOG.md."
            Write-Error ""
            Write-Error "Expected something like:"
            Write-Error "## [$version] - YYYY-MM-DD"
            exit 1
          }

          $notes = $match.Value.Trim()

          # Remove the version heading.
          # GitHub already displays the release title.

          $notes = $notes -replace `
            "(?m)^## \[$escapedVersion\].*\r?\n", ""

          $notes = $notes.Trim()

          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Error "The CHANGELOG section for $version is empty."
            exit 1
          }

          Set-Content `
            -Path "release-notes.md" `
            -Value $notes `
            -Encoding utf8

          Write-Host ""
          Write-Host "============================================"
          Write-Host " RELEASE NOTES FOR $tagVersion"
          Write-Host "============================================"
          Write-Host $notes
          Write-Host "============================================"


      # ============================================================
      # CREATE GITHUB RELEASE
      #
      # ONLY runs for v*.*.* tags.
      #
      # Example:
      #
      # v1.0.2
      #
      # Creates:
      #
      # SystemInfo v1.0.2
      #
      # With:
      # - The matching CHANGELOG section
      # - SystemInfo-Setup.exe
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SystemInfo ${{ github.ref_name }}"
          body_path: release-notes.md
          files: Output/SystemInfo-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
