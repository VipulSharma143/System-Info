name: Build Windows Installer

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ============================================================
      # CHECK OUT REPOSITORY
      # ============================================================

      - name: Check out the repo
        uses: actions/checkout@v5


      # ============================================================
      # .NET
      # ============================================================

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"


      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # BUILD TOOLS
      # ============================================================

      - name: Install NASM
        run: choco install nasm -y

      - name: Install Inno Setup
        run: choco install innosetup -y


      # ============================================================
      # BUILD NATIVE C++ ENGINE
      # ============================================================

      - name: Build native C++ engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring CMake..."

          cmake -B native/build -A x64 native

          Write-Host "Building native C++ engine..."

          cmake --build native/build `
            --config Release `
            --parallel

          Write-Host "Searching for systemmonitor_native.dll..."

          $dll = Get-ChildItem `
            -Path "native/build" `
            -Recurse `
            -Filter "systemmonitor_native.dll" |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "systemmonitor_native.dll was not produced by the build."
            exit 1
          }

          Write-Host "Found native DLL:"
          Write-Host $dll.FullName

          $destination = "backend/SystemMonitor.Api/systemmonitor_native.dll"

          Copy-Item `
            -Path $dll.FullName `
            -Destination $destination `
            -Force

          Write-Host "Copied native DLL to:"
          Write-Host $destination


      # ============================================================
      # BUILD .NET BACKEND
      # ============================================================

      - name: Restore and build .NET backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore backend/SystemMonitor.Api

          dotnet build backend/SystemMonitor.Api `
            --configuration Release `
            --no-restore


      # ============================================================
      # BUILD FRONTEND
      # ============================================================

      - name: Install frontend dependencies and build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "package-lock.json") {
            Write-Host "package-lock.json found. Using npm ci..."
            npm ci
          }
          else {
            Write-Host "package-lock.json not found. Using npm install..."
            npm install
          }

          npm run build


      # ============================================================
      # PYTHON ANALYTICS
      # ============================================================

      - name: Install Python analytics dependencies
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            Write-Host "Installing dependencies from analytics/requirements.txt..."

            python -m pip install -r requirements.txt
          }
          else {
            Write-Host "analytics/requirements.txt not found."
            Write-Host "Installing required Python dependencies..."

            python -m pip install fastapi uvicorn pymongo
          }


      # ============================================================
      # BUILD SystemInfo.exe
      # ============================================================

      - name: Build SystemInfo.exe from start-all.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path ".\start-all.ps1")) {
            Write-Error "start-all.ps1 was not found."
            exit 1
          }

          if (-not (Test-Path ".\SystemInfo.ico")) {
            Write-Error "SystemInfo.ico was not found."
            exit 1
          }

          Write-Host "Installing ps2exe..."

          Install-Module `
            ps2exe `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

          Write-Host "Building SystemInfo.exe..."

          Invoke-ps2exe `
            .\start-all.ps1 `
            .\SystemInfo.exe `
            -iconFile .\SystemInfo.ico `
            -noConsole `
            -title "SystemInfo"

          if (-not (Test-Path ".\SystemInfo.exe")) {
            Write-Error "SystemInfo.exe was not created."
            exit 1
          }

          Write-Host "SystemInfo.exe created successfully."


      # ============================================================
      # COMPILE INSTALLER WITH INNO SETUP
      # ============================================================

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler was not found:"
            Write-Error $iscc
            exit 1
          }

          if (-not (Test-Path ".\SystemInfo.iss")) {
            Write-Error "SystemInfo.iss was not found."
            exit 1
          }

          Write-Host "Compiling installer..."

          & $iscc ".\SystemInfo.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }


      # ============================================================
      # VERIFY INSTALLER
      # ============================================================

      - name: Verify installer exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "Output/SystemInfo-Setup.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Output/SystemInfo-Setup.exe was not created."

            Write-Host ""
            Write-Host "Searching for EXE files..."

            Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter "*.exe" |
              Select-Object FullName, Length

            exit 1
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "============================================"
          Write-Host " WINDOWS INSTALLER CREATED SUCCESSFULLY"
          Write-Host "============================================"
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "============================================"


      # ============================================================
      # UPLOAD INSTALLER ARTIFACT
      # ============================================================

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-Setup
          path: Output/SystemInfo-Setup.exe
          if-no-files-found: error
          retention-days: 30