name: Build Windows Installer

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Check out the repo
        uses: actions/checkout@v5

      # ============================================================
      # TOOLCHAINS
      # ============================================================
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm -y

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup -y

      # ============================================================
      # DETERMINE VERSION
      # ============================================================
      - name: Determine application version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $null

          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".Substring(1)
          }
          else {
            $match = Select-String `
              -Path "CHANGELOG.md" `
              -Pattern '^## \[([0-9]+\.[0-9]+\.[0-9]+)\]' `
              | Select-Object -First 1

            if ($match) {
              $version = $match.Matches[0].Groups[1].Value
            }
            else {
              $version = "0.0.0"
            }
          }

          Write-Host "Application version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      # ============================================================
      # BUILD NATIVE C++ ENGINE
      # ============================================================
      - name: Build native C++ engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "============================================"
          Write-Host " BUILDING NATIVE C++ ENGINE"
          Write-Host "============================================"

          cmake -B native/build `
            -A x64 `
            native

          cmake --build native/build `
            --config Release `
            --parallel

          Write-Host ""
          Write-Host "Searching for systemmonitor_native.dll..."

          $dll = Get-ChildItem `
            -Path "native/build" `
            -Recurse `
            -Filter "systemmonitor_native.dll" |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "systemmonitor_native.dll was not produced."
            exit 1
          }

          Write-Host "Found:"
          Write-Host $dll.FullName

          $destination = "backend/SystemMonitor.Api/systemmonitor_native.dll"

          Copy-Item `
            -Path $dll.FullName `
            -Destination $destination `
            -Force

          Write-Host "Copied native DLL to:"
          Write-Host $destination

      # ============================================================
      # BUILD FRONTEND
      # ============================================================
      - name: Install frontend dependencies and build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "package-lock.json") {
            Write-Host "Installing frontend dependencies with npm ci..."
            npm ci
          }
          else {
            Write-Host "package-lock.json not found. Using npm install..."
            npm install
          }

          Write-Host "Building production frontend..."
          npm run build

          if (-not (Test-Path "dist")) {
            Write-Error "Frontend dist directory was not created."
            exit 1
          }

          Write-Host "Frontend build completed."

      # ============================================================
      # EMBED FRONTEND INTO BACKEND
      # ============================================================
      - name: Embed frontend into backend wwwroot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $wwwroot = "backend/SystemMonitor.Api/wwwroot"

          if (Test-Path $wwwroot) {
            Remove-Item `
              -Path $wwwroot `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $wwwroot `
            -Force | Out-Null

          Copy-Item `
            -Path "frontend/dist/*" `
            -Destination $wwwroot `
            -Recurse `
            -Force

          Write-Host "Frontend embedded into:"
          Write-Host $wwwroot

          $files = Get-ChildItem `
            -Path $wwwroot `
            -Recurse `
            -File

          if ($files.Count -eq 0) {
            Write-Error "Backend wwwroot is empty."
            exit 1
          }

          Write-Host "Embedded frontend files: $($files.Count)"

      # ============================================================
      # RESTORE BACKEND
      # ============================================================
      - name: Restore backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore backend/SystemMonitor.Api

      # ============================================================
      # PUBLISH BACKEND
      # ============================================================
      - name: Publish backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "build/backend") {
            Remove-Item `
              -Path "build/backend" `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "build/backend" `
            -Force | Out-Null

          Write-Host "Publishing backend as self-contained win-x64..."

          dotnet publish backend/SystemMonitor.Api `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output build/backend `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true

          $backendExe = "build/backend/SystemMonitor.Api.exe"

          if (-not (Test-Path $backendExe)) {
            Write-Error "Published backend executable was not created: $backendExe"
            exit 1
          }

          Write-Host ""
          Write-Host "Backend published successfully:"
          Get-Item $backendExe | Select-Object FullName, Length

          # Native DLL must sit beside the published backend executable.
          $nativeDll = "backend/SystemMonitor.Api/systemmonitor_native.dll"

          if (-not (Test-Path $nativeDll)) {
            Write-Error "Native DLL is missing: $nativeDll"
            exit 1
          }

          Copy-Item `
            -Path $nativeDll `
            -Destination "build/backend/systemmonitor_native.dll" `
            -Force

          Write-Host "Native DLL copied beside backend executable."

      # ============================================================
      # INSTALL PYTHON ANALYTICS DEPENDENCIES
      # ============================================================
      - name: Install analytics dependencies
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            Write-Host "Installing analytics runtime dependencies..."
            python -m pip install -r requirements.txt
          }
          else {
            Write-Host "requirements.txt not found."
            python -m pip install `
              fastapi `
              uvicorn `
              pymongo
          }

          if (Test-Path "requirements-build.txt") {
            Write-Host "Installing analytics build dependencies..."
            python -m pip install -r requirements-build.txt
          }
          else {
            Write-Host "requirements-build.txt not found. Installing PyInstaller..."
            python -m pip install pyinstaller
          }

      # ============================================================
      # BUILD ANALYTICS.EXE
      # ============================================================
      - name: Build analytics.exe with PyInstaller
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "build") {
            Remove-Item `
              -Path "build" `
              -Recurse `
              -Force
          }

          if (Test-Path "dist") {
            Remove-Item `
              -Path "dist" `
              -Recurse `
              -Force
          }

          if (Test-Path "analytics.spec") {
            Remove-Item `
              -Path "analytics.spec" `
              -Force
          }

          Write-Host "Building analytics.exe..."

          python -m PyInstaller `
            --onefile `
            --clean `
            --noconfirm `
            --name analytics `
            run_analytics.py

          $analyticsExe = "dist/analytics.exe"

          if (-not (Test-Path $analyticsExe)) {
            Write-Error "PyInstaller did not create analytics.exe."
            exit 1
          }

          Write-Host ""
          Write-Host "analytics.exe created:"
          Get-Item $analyticsExe | Select-Object FullName, Length

      # ============================================================
      # PUBLISH PRODUCTION LAUNCHER
      # ============================================================
      - name: Publish production SystemInfo launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "build/launcher") {
            Remove-Item `
              -Path "build/launcher" `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path "build/launcher" `
            -Force | Out-Null

          Write-Host "Publishing production launcher..."

          dotnet publish launcher/SystemInfo.Launcher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output build/launcher `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true

          $launcherExe = "build/launcher/SystemInfo.exe"

          if (-not (Test-Path $launcherExe)) {
            Write-Error "Production launcher was not created: $launcherExe"
            exit 1
          }

          Write-Host ""
          Write-Host "Production launcher created:"
          Get-Item $launcherExe | Select-Object FullName, Length

      # ============================================================
      # CREATE PRODUCTION STAGING DIRECTORY
      # ============================================================
      - name: Assemble production packaging/app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $staging = "packaging/app"

          if (Test-Path $staging) {
            Remove-Item `
              -Path $staging `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $staging `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$staging/backend" `
            -Force | Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$staging/analytics" `
            -Force | Out-Null

          Write-Host "Copying production launcher..."

          Copy-Item `
            "build/launcher/SystemInfo.exe" `
            "$staging/SystemInfo.exe" `
            -Force

          Write-Host "Copying application icon..."

          Copy-Item `
            "SystemInfo.ico" `
            "$staging/SystemInfo.ico" `
            -Force

          Write-Host "Copying backend..."

          Copy-Item `
            "build/backend/*" `
            "$staging/backend" `
            -Recurse `
            -Force

          Write-Host "Copying analytics..."

          Copy-Item `
            "analytics/dist/analytics.exe" `
            "$staging/analytics/analytics.exe" `
            -Force

          Write-Host ""
          Write-Host "============================================"
          Write-Host " PRODUCTION STAGING CREATED"
          Write-Host "============================================"

          Get-ChildItem `
            -Path $staging `
            -Recurse `
            -File |
            Select-Object FullName, Length

      # ============================================================
      # VALIDATE PRODUCTION PACKAGE
      # ============================================================
      - name: Validate production staging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "packaging/app/SystemInfo.exe",
            "packaging/app/SystemInfo.ico",
            "packaging/app/backend/SystemMonitor.Api.exe",
            "packaging/app/backend/systemmonitor_native.dll",
            "packaging/app/analytics/analytics.exe"
          )

          Write-Host "Validating required production files..."

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "Required production file is missing: $file"
              exit 1
            }

            $item = Get-Item $file

            if ($item.Length -le 0) {
              Write-Error "Production file is empty: $file"
              exit 1
            }

            Write-Host "OK: $file ($($item.Length) bytes)"
          }

          $wwwroot = "packaging/app/backend/wwwroot"

          if (-not (Test-Path $wwwroot)) {
            Write-Error "Production backend wwwroot is missing."
            exit 1
          }

          $frontendFiles = Get-ChildItem `
            -Path $wwwroot `
            -Recurse `
            -File

          if ($frontendFiles.Count -eq 0) {
            Write-Error "Production backend wwwroot contains no frontend files."
            exit 1
          }

          Write-Host ""
          Write-Host "Frontend files packaged: $($frontendFiles.Count)"

          Write-Host ""
          Write-Host "Production staging validation passed."

      # ============================================================
      # SET INNO SETUP VERSION
      # ============================================================
      - name: Set installer version
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:APP_VERSION

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Application version is empty."
            exit 1
          }

          Write-Host "Setting Inno Setup application version to $version"

          $iss = Get-Content "SystemInfo.iss" -Raw

          $updated = $iss -replace `
            '#define MyAppVersion "1\.0"', `
            "#define MyAppVersion `"$version`""

          if ($updated -eq $iss) {
            Write-Error "Could not find the expected MyAppVersion definition in SystemInfo.iss."
            exit 1
          }

          Set-Content `
            -Path "SystemInfo.iss" `
            -Value $updated `
            -Encoding UTF8

          Write-Host "SystemInfo.iss version updated."

      # ============================================================
      # COMPILE INNO SETUP INSTALLER
      # ============================================================
      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler was not found:"
            Write-Error $iscc
            exit 1
          }

          if (-not (Test-Path "SystemInfo.iss")) {
            Write-Error "SystemInfo.iss was not found."
            exit 1
          }

          if (-not (Test-Path "packaging/app/SystemInfo.exe")) {
            Write-Error "Production launcher is missing from packaging/app."
            exit 1
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host " COMPILING WINDOWS INSTALLER"
          Write-Host "============================================"

          & $iscc ".\SystemInfo.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "Inno Setup completed successfully."

      # ============================================================
      # VERIFY INSTALLER
      # ============================================================
      - name: Verify installer exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "Output/SystemInfo-Setup.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Output/SystemInfo-Setup.exe was not created."

            Write-Host ""
            Write-Host "Generated EXE files:"

            Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter "*.exe" |
              Select-Object FullName, Length

            exit 1
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "============================================"
          Write-Host " WINDOWS INSTALLER CREATED SUCCESSFULLY"
          Write-Host "============================================"
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "============================================"

      # ============================================================
      # UPLOAD INSTALLER
      # ============================================================
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-Setup
          path: Output/SystemInfo-Setup.exe
          if-no-files-found: error
          retention-days: 30