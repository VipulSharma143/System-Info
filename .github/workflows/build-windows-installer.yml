name: Build Windows Installer

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGING_DIR: packaging/app

jobs:
  build:
    runs-on: windows-latest

    steps:

      # ============================================================
      # CHECK OUT REPOSITORY
      # ============================================================

      - name: Check out the repo
        uses: actions/checkout@v5


      # ============================================================
      # TOOLCHAIN (build-time only — none of this ships to the user)
      # ============================================================

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install NASM
        run: choco install nasm -y

      - name: Install Inno Setup
        run: choco install innosetup -y


      # ============================================================
      # BUILD NATIVE C++ ENGINE
      # ============================================================

      - name: Build native C++ engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -B native/build -A x64 native
          cmake --build native/build --config Release --parallel

          $dll = Get-ChildItem -Path "native/build" -Recurse -Filter "systemmonitor_native.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Error "systemmonitor_native.dll was not produced by the build."
            exit 1
          }

          Copy-Item -Path $dll.FullName -Destination "backend/SystemMonitor.Api/systemmonitor_native.dll" -Force
          Write-Host "Copied native DLL from $($dll.FullName)"


      # ============================================================
      # BUILD FRONTEND (production React bundle)
      # ============================================================

      - name: Install frontend dependencies and build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "package-lock.json") { npm ci } else { npm install }
          npm run build

          if (-not (Test-Path "dist/index.html")) {
            Write-Error "frontend/dist/index.html was not produced by npm run build."
            exit 1
          }


      # ============================================================
      # PUBLISH .NET BACKEND (self-contained, embeds the frontend build)
      # ============================================================
      #
      # This is a `dotnet publish`, not `dotnet build` — it produces a
      # self-contained win-x64 output that runs with no .NET runtime/SDK
      # installed on the target machine. The "Copy frontend build into
      # wwwroot" step below runs first, placing frontend/dist's files into
      # wwwroot BEFORE this publish — the .NET SDK decides which wwwroot
      # files are publishable at project-evaluation time, so they need to
      # already be on disk before `dotnet publish` starts.

      - name: Copy frontend build into wwwroot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $wwwroot = "backend/SystemMonitor.Api/wwwroot"
          New-Item -ItemType Directory -Force -Path $wwwroot | Out-Null
          Copy-Item -Path "frontend/dist/*" -Destination $wwwroot -Recurse -Force

          if (-not (Test-Path "$wwwroot/index.html")) {
            Write-Error "$wwwroot/index.html missing after copying frontend/dist — frontend build did not produce the expected output."
            exit 1
          }

      - name: Publish .NET backend (self-contained win-x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet publish backend/SystemMonitor.Api `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$env:STAGING_DIR/backend"

          if (-not (Test-Path "$env:STAGING_DIR/backend/SystemMonitor.Api.exe")) {
            Write-Error "SystemMonitor.Api.exe was not produced by dotnet publish."
            exit 1
          }
          if (-not (Test-Path "$env:STAGING_DIR/backend/wwwroot/index.html")) {
            Write-Error "wwwroot/index.html missing from publish output — frontend was not embedded."
            exit 1
          }
          if (-not (Test-Path "$env:STAGING_DIR/backend/systemmonitor_native.dll")) {
            Write-Error "systemmonitor_native.dll missing from publish output."
            exit 1
          }


      # ============================================================
      # PACKAGE PYTHON ANALYTICS AS A STANDALONE EXE (PyInstaller)
      # ============================================================
      #
      # End users get analytics.exe — a frozen executable with the Python
      # interpreter and all dependencies bundled in. No python/pip on their
      # machine. requirements-build.txt is build-time only.

      - name: Install analytics build dependencies
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Package analytics.exe with PyInstaller
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          pyinstaller --onefile --name analytics run_analytics.py

          if (-not (Test-Path "dist/analytics.exe")) {
            Write-Error "analytics.exe was not produced by PyInstaller."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "../$env:STAGING_DIR/analytics" | Out-Null
          Copy-Item "dist/analytics.exe" "../$env:STAGING_DIR/analytics/analytics.exe" -Force


      # ============================================================
      # PUBLISH THE PRODUCTION LAUNCHER (SystemInfo.exe)
      # ============================================================
      #
      # Replaces the old ps2exe-compiled start-all.ps1. This is a real
      # self-contained .NET publish, not a PowerShell-to-exe wrapper.

      - name: Publish launcher (SystemInfo.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet publish launcher/SystemInfo.Launcher.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "$env:STAGING_DIR/_launcher_out"

          Copy-Item "$env:STAGING_DIR/_launcher_out/SystemInfo.exe" "$env:STAGING_DIR/SystemInfo.exe" -Force
          Copy-Item "SystemInfo.ico" "$env:STAGING_DIR/SystemInfo.ico" -Force
          Remove-Item "$env:STAGING_DIR/_launcher_out" -Recurse -Force

          if (-not (Test-Path "$env:STAGING_DIR/SystemInfo.exe")) {
            Write-Error "SystemInfo.exe (launcher) was not produced."
            exit 1
          }


      # ============================================================
      # VALIDATE STAGING DIRECTORY (Phase 11 — production validation)
      # ============================================================
      #
      # Fails fast, with a clear reason, if anything dev-only ended up in the
      # staging directory, or anything required is missing — instead of
      # discovering it after a user installs.

      - name: Validate production staging directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $staging = $env:STAGING_DIR

          $required = @(
            "SystemInfo.exe",
            "SystemInfo.ico",
            "backend/SystemMonitor.Api.exe",
            "backend/systemmonitor_native.dll",
            "backend/wwwroot/index.html",
            "analytics/analytics.exe"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $staging $_)) }
          if ($missing) {
            Write-Error "Missing required staged files:`n$($missing -join "`n")"
            exit 1
          }

          $forbiddenNames = @("*.csproj", "*.ts", "*.tsx", "package.json", "requirements.txt", "*.py", "*.asm", ".git")
          foreach ($pattern in $forbiddenNames) {
            $hits = Get-ChildItem -Path $staging -Recurse -Filter $pattern -ErrorAction SilentlyContinue
            if ($hits) {
              Write-Error "Development/source files found in staging directory (should never ship to users):`n$($hits.FullName -join "`n")"
              exit 1
            }
          }

          Write-Host "Staging directory validated: production-only, all required files present."


      # ============================================================
      # COMPILE INSTALLER WITH INNO SETUP
      # ============================================================

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler was not found: $iscc"
            exit 1
          }

          & $iscc ".\SystemInfo.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }


      # ============================================================
      # VERIFY INSTALLER
      # ============================================================

      - name: Verify installer exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "Output/SystemInfo-Setup.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Output/SystemInfo-Setup.exe was not created."
            exit 1
          }

          $file = Get-Item $installer
          Write-Host "WINDOWS INSTALLER CREATED SUCCESSFULLY"
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"


      # ============================================================
      # UPLOAD INSTALLER ARTIFACT
      # ============================================================

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-Setup
          path: Output/SystemInfo-Setup.exe
          if-no-files-found: error
          retention-days: 30
