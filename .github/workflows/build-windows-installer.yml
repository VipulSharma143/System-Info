name: Build Windows Installer

on:
  # Normal development builds
  push:
    branches:
      - main

    # Version tags create official GitHub Releases
    # Examples: v1.0.0, v1.0.1, v1.0.2
    tags:
      - "v*.*.*"

  # Manual build from GitHub Actions
  workflow_dispatch:

# Required to create GitHub Releases
permissions:
  contents: write

# If several commits are pushed quickly, cancel the older
# unfinished build for the same branch/tag.
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Check out the repo
        uses: actions/checkout@v5


      # ============================================================
      # .NET
      # ============================================================

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"


      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"


      # ============================================================
      # PYTHON
      #
      # No cache-dependency-path here because your repository does
      # not currently contain analytics/requirements.txt.
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ============================================================
      # BUILD TOOLS
      # ============================================================

      - name: Install NASM
        run: choco install nasm -y

      - name: Install Inno Setup
        run: choco install innosetup -y


      # ============================================================
      # BUILD NATIVE C++ ENGINE
      # ============================================================

      - name: Build native C++ engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring native C++ engine..."

          cmake -B native/build -A x64 native

          Write-Host "Building native C++ engine..."

          cmake --build native/build `
            --config Release `
            --parallel

          Write-Host "Searching for systemmonitor_native.dll..."

          $dll = Get-ChildItem `
            -Path "native/build" `
            -Recurse `
            -Filter "systemmonitor_native.dll" |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "systemmonitor_native.dll was not produced by the build."
            exit 1
          }

          Write-Host "Found:"
          Write-Host $dll.FullName

          $destination = "backend/SystemMonitor.Api/systemmonitor_native.dll"

          Copy-Item `
            -Path $dll.FullName `
            -Destination $destination `
            -Force

          Write-Host "Native DLL copied to:"
          Write-Host $destination


      # ============================================================
      # BUILD .NET BACKEND
      # ============================================================

      - name: Restore .NET backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet restore backend/SystemMonitor.Api


      - name: Build .NET backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          dotnet build backend/SystemMonitor.Api `
            --configuration Release `
            --no-restore


      # ============================================================
      # BUILD FRONTEND
      # ============================================================

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "package-lock.json") {
            Write-Host "package-lock.json found. Running npm ci..."
            npm ci
          }
          else {
            Write-Host "package-lock.json not found. Running npm install..."
            npm install
          }


      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npm run build


      # ============================================================
      # PYTHON ANALYTICS
      #
      # If analytics/requirements.txt exists, use it.
      # Otherwise install the dependencies you previously specified.
      # ============================================================

      - name: Install Python analytics dependencies
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "requirements.txt") {
            Write-Host "analytics/requirements.txt found."
            Write-Host "Installing Python dependencies from requirements.txt..."

            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
          }
          else {
            Write-Host "analytics/requirements.txt not found."
            Write-Host "Installing required Python dependencies..."

            python -m pip install --upgrade pip
            python -m pip install fastapi uvicorn pymongo
          }


      # ============================================================
      # BUILD SystemInfo.exe
      # ============================================================

      - name: Build SystemInfo.exe from start-all.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path ".\start-all.ps1")) {
            Write-Error "start-all.ps1 was not found."
            exit 1
          }

          if (-not (Test-Path ".\SystemInfo.ico")) {
            Write-Error "SystemInfo.ico was not found."
            exit 1
          }

          Write-Host "Installing ps2exe..."

          Install-Module `
            ps2exe `
            -Scope CurrentUser `
            -Force `
            -AllowClobber

          Write-Host "Building SystemInfo.exe..."

          Invoke-ps2exe `
            .\start-all.ps1 `
            .\SystemInfo.exe `
            -iconFile .\SystemInfo.ico `
            -noConsole `
            -title "SystemInfo"

          if (-not (Test-Path ".\SystemInfo.exe")) {
            Write-Error "SystemInfo.exe was not created."
            exit 1
          }

          Write-Host "SystemInfo.exe created successfully."


      # ============================================================
      # COMPILE INSTALLER
      # ============================================================

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler was not found:"
            Write-Error $iscc
            exit 1
          }

          if (-not (Test-Path ".\SystemInfo.iss")) {
            Write-Error "SystemInfo.iss was not found."
            exit 1
          }

          Write-Host "Compiling Windows installer..."

          & $iscc ".\SystemInfo.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }


      # ============================================================
      # VERIFY INSTALLER
      # ============================================================

      - name: Verify installer exists
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "Output/SystemInfo-Setup.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Installer was not created:"
            Write-Error $installer

            Write-Host ""
            Write-Host "Searching for all EXE files..."

            Get-ChildItem `
              -Path . `
              -Recurse `
              -Filter "*.exe" |
              Select-Object FullName, Length

            exit 1
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "============================================"
          Write-Host " WINDOWS INSTALLER CREATED"
          Write-Host "============================================"
          Write-Host "Path: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "============================================"


      # ============================================================
      # UPLOAD ACTIONS ARTIFACT
      #
      # Every successful build gets an artifact.
      #
      # Normal main push:
      #   Actions -> Artifacts
      #
      # Version tag:
      #   Actions -> Artifacts
      #   AND GitHub Release
      # ============================================================

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-Setup
          path: Output/SystemInfo-Setup.exe
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # PREPARE RELEASE NOTES FROM CHANGELOG
      #
      # Only runs for version tags.
      #
      # Example:
      #
      # v1.0.2
      #
      # It finds:
      #
      # ## [1.0.2]
      #
      # and takes ONLY that section.
      # ============================================================

      - name: Prepare release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}"

          Write-Host "Preparing release notes for $version..."

          if (-not (Test-Path "CHANGELOG.md")) {
            Write-Error "CHANGELOG.md was not found."
            exit 1
          }

          $changelog = Get-Content `
            "CHANGELOG.md" `
            -Raw

          $escapedVersion = [regex]::Escape($version)

          # Find the section belonging to this version.
          #
          # Example:
          #
          # ## [1.0.2] - 2026-09-20
          #
          # and stop before:
          #
          # ## [1.0.1]
          #
          $pattern = "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)"

          $match = [regex]::Match(
            $changelog,
            $pattern
          )

          if (-not $match.Success) {
            Write-Error "Could not find [$version] in CHANGELOG.md."
            Write-Error ""
            Write-Error "Expected something like:"
            Write-Error "## [$version] - YYYY-MM-DD"
            exit 1
          }

          $notes = $match.Value.Trim()

          # Remove the ## [version] heading.
          # GitHub will use the release title instead.
          $notes = $notes -replace `
            "(?m)^## \[$escapedVersion\].*\r?\n", ""

          $notes = $notes.Trim()

          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Error "The CHANGELOG section for $version is empty."
            exit 1
          }

          Set-Content `
            -Path "release-notes.md" `
            -Value $notes `
            -Encoding utf8

          Write-Host ""
          Write-Host "============================================"
          Write-Host " RELEASE NOTES FOR $version"
          Write-Host "============================================"
          Write-Host $notes
          Write-Host "============================================"


      # ============================================================
      # CREATE GITHUB RELEASE
      #
      # ONLY runs for v*.*.* tags.
      #
      # Example:
      #
      # git tag v1.0.2
      # git push origin v1.0.2
      #
      # Creates:
      #
      # SystemInfo v1.0.2
      #
      # with:
      # - Only the 1.0.2 CHANGELOG section
      # - SystemInfo-Setup.exe
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "SystemInfo ${{ github.ref_name }}"
          body_path: release-notes.md
          files: Output/SystemInfo-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
