name: Release

# ============================================================
# SINGLE consolidated pipeline. Replaces the old 4-workflow chain
# (Build Windows Installer / Build Linux Installer / Create Release Tag /
# Create Release) that was connected via `workflow_run` events.
#
# Why that design was replaced:
#   - workflow_run fires once PER upstream workflow, not once per "both
#     finished" — so the tag/release workflow ran twice per push and had
#     to poll-and-guess whether the other build was done yet.
#   - If the tag-creation job failed for any reason, the release job's
#     `if: conclusion == 'success'` check just silently skipped it — no
#     visible error anywhere.
#   - Once a version's tag existed (even from a broken build), every
#     future push died at the same "tag already exists" check forever,
#     regardless of whether the new build succeeded.
#   - Version number was computed independently (with different regex/
#     fallback logic) in three separate files.
#
# This workflow uses `needs:` instead, which is GitHub Actions' native
# primitive for "run this job only after these other jobs succeeded,
# regardless of which one finished first." No polling, no cross-workflow
# events, no partial states.
# ============================================================

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # JOB 1 — determine version, decide whether a release is needed at all.
  # Single source of truth for the version number: every other job reads
  # it from here instead of re-computing it.
  # ============================================================
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version from CHANGELOG.md
        id: version
        shell: bash
        run: |
          set -e
          VERSION=$(grep -m 1 -oP '^## \[\K[0-9]+(?:\.[0-9]+){2,3}(?=\])' CHANGELOG.md || true)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not find a version in CHANGELOG.md. Expected a line like '## [1.2.3]'."
            exit 1
          fi

          echo "Version from CHANGELOG.md: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: check
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          set -e

          git fetch --tags origin

          TAG_SHA=$(git rev-list -n 1 "refs/tags/$TAG" 2>/dev/null || true)
          CURRENT_SHA="${{ github.sha }}"

          echo "Tag:           $TAG"
          echo "Tag commit:    ${TAG_SHA:-<does not exist>}"
          echo "Current commit: $CURRENT_SHA"

          if [ -z "$TAG_SHA" ]; then
            echo "Tag does not exist yet — this push will create a new release."
            echo "skip=false" >> "$GITHUB_OUTPUT"

          elif [ "$TAG_SHA" == "$CURRENT_SHA" ]; then
            echo "Tag already points at this exact commit — already released. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"

          else
            echo "::error::Version $TAG is already tagged, but at a DIFFERENT commit ($TAG_SHA)."
            echo "::error::CHANGELOG.md still lists $TAG as the top version, but that version was already released from different code."
            echo "::error::Add a new version entry to CHANGELOG.md before pushing again — released versions are never moved or overwritten."
            exit 1
          fi

  # ============================================================
  # JOB 2 — Windows build. Only starts once `version` has decided a
  # release is actually needed (skip=false). Any failure here means the
  # `release` job below never runs, automatically — no manual status
  # checking required.
  # ============================================================
  build-windows:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('backend/SystemMonitor.Api/*.csproj') }}
          restore-keys: |
            nuget-windows-

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (frontend/src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Sync application version
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          # Single authoritative version (migration spec sections 34/40/41):
          # propagates $APP_VERSION (already derived from CHANGELOG.md by
          # the `version` job) into package.json, tauri.conf.json,
          # Cargo.toml, Directory.Build.props, and SystemInfo.iss in one
          # pass, then fails the build loudly if anything still disagrees —
          # instead of silently shipping a UI that shows the wrong version.
          node scripts/sync-version.mjs $env:APP_VERSION
          node scripts/check-version.mjs

      - name: Install NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm -y

      - name: Build native C++ engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -B native/build -A x64 native
          cmake --build native/build --config Release --parallel

          $dll = Get-ChildItem -Path "native/build" -Recurse -Filter "systemmonitor_native.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Error "systemmonitor_native.dll was not produced."
            exit 1
          }

          Copy-Item -Path $dll.FullName -Destination "backend/SystemMonitor.Api/systemmonitor_native.dll" -Force

      - name: Install frontend dependencies and build
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "package-lock.json") { npm ci } else { npm install }
          npm run build

          if (-not (Test-Path "dist")) {
            Write-Error "Frontend dist directory was not created."
            exit 1
          }

      - name: Embed frontend into backend wwwroot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $wwwroot = "backend/SystemMonitor.Api/wwwroot"
          if (Test-Path $wwwroot) { Remove-Item -Path $wwwroot -Recurse -Force }
          New-Item -ItemType Directory -Path $wwwroot -Force | Out-Null
          Copy-Item -Path "frontend/dist/*" -Destination $wwwroot -Recurse -Force

          $files = Get-ChildItem -Path $wwwroot -Recurse -File
          if ($files.Count -eq 0) {
            Write-Error "Backend wwwroot is empty after copying frontend/dist."
            exit 1
          }

      - name: Restore backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore backend/SystemMonitor.Api

      - name: Publish backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "build/backend") { Remove-Item -Path "build/backend" -Recurse -Force }
          New-Item -ItemType Directory -Path "build/backend" -Force | Out-Null

          dotnet publish backend/SystemMonitor.Api `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output build/backend `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true

          $backendExe = "build/backend/SystemMonitor.Api.exe"
          if (-not (Test-Path $backendExe)) {
            Write-Error "Published backend executable was not created: $backendExe"
            exit 1
          }

          $nativeDll = "backend/SystemMonitor.Api/systemmonitor_native.dll"
          if (-not (Test-Path $nativeDll)) {
            Write-Error "Native DLL is missing: $nativeDll"
            exit 1
          }

          Copy-Item -Path $nativeDll -Destination "build/backend/systemmonitor_native.dll" -Force

      - name: Install analytics dependencies
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          } else {
            python -m pip install fastapi uvicorn
          }

          if (Test-Path "requirements-build.txt") {
            python -m pip install -r requirements-build.txt
          } else {
            python -m pip install pyinstaller
          }

      - name: Build analytics.exe with PyInstaller
        working-directory: analytics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (Test-Path "build") { Remove-Item -Path "build" -Recurse -Force }
          if (Test-Path "dist") { Remove-Item -Path "dist" -Recurse -Force }
          if (Test-Path "analytics.spec") { Remove-Item -Path "analytics.spec" -Force }

          # uvicorn resolves some of its internals (HTTP protocol impl,
          # lifespan handling, event loop) dynamically by string name at
          # startup, not via ordinary Python imports — PyInstaller's static
          # dependency scan can't see those, so without explicitly collecting
          # them, analytics.exe builds successfully but crashes on launch the
          # moment uvicorn tries to load one. --collect-submodules pulls in
          # every uvicorn submodule so this can't silently go missing again.
          python -m PyInstaller --onefile --clean --noconfirm --name analytics `
            --collect-submodules uvicorn `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.loops.asyncio `
            run_analytics.py

          if (-not (Test-Path "dist/analytics.exe")) {
            Write-Error "PyInstaller did not create analytics.exe."
            exit 1
          }

      - name: Stage backend and analytics as Tauri resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Tauri's bundler copies whatever sits under these paths into the
          # installed app (see frontend/src-tauri/tauri.conf.json's
          # bundle.resources), the same way "Assemble production
          # packaging/app" used to stage packaging/app/ for Inno Setup. Not
          # committed to the repo — see frontend/src-tauri/.gitignore.
          $backendDest = "frontend/src-tauri/resources/backend"
          $analyticsDest = "frontend/src-tauri/resources/analytics"

          if (Test-Path $backendDest) { Remove-Item -Path $backendDest -Recurse -Force }
          New-Item -ItemType Directory -Path $backendDest -Force | Out-Null
          Copy-Item "build/backend/*" $backendDest -Recurse -Force

          if (Test-Path $analyticsDest) { Remove-Item -Path $analyticsDest -Recurse -Force }
          New-Item -ItemType Directory -Path $analyticsDest -Force | Out-Null
          Copy-Item "analytics/dist/analytics.exe" "$analyticsDest/analytics.exe" -Force

      - name: Validate Tauri resource staging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $requiredFiles = @(
            "frontend/src-tauri/resources/backend/SystemMonitor.Api.exe",
            "frontend/src-tauri/resources/backend/systemmonitor_native.dll",
            "frontend/src-tauri/resources/analytics/analytics.exe",
            "frontend/src-tauri/icons/icon.ico"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "Required Tauri resource is missing: $file"
              exit 1
            }
            if ((Get-Item $file).Length -le 0) {
              Write-Error "Tauri resource is empty: $file"
              exit 1
            }
          }

          Write-Host "Tauri resource staging validated."

      - name: Install Tauri CLI
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Already a devDependency (package.json), installed by the earlier
          # `npm ci`/`npm install` — this just confirms it resolved.
          npx tauri --version

      - name: Build Tauri application and installer
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Runs beforeBuildCommand (`npm run build`, i.e. `vite build`)
          # itself, so the frontend/dist produced by the earlier "Install
          # frontend dependencies and build" step is rebuilt here too — kept
          # deliberately redundant so that step's own dist/-exists check
          # still catches a broken frontend build before the much longer
          # Tauri/Rust compile even starts.
          npx tauri build

      - name: Locate and verify NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Get-ChildItem -Path "frontend/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -Recurse |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "No NSIS installer (*-setup.exe) was produced under frontend/src-tauri/target/release/bundle/nsis."
            exit 1
          }

          New-Item -ItemType Directory -Path "Output" -Force | Out-Null
          # Renamed to a stable filename so the release job's artifact
          # download/upload globs don't need to know the exact
          # productName_version_arch-setup.exe Tauri generates.
          Copy-Item $installer.FullName "Output/SystemInfo-Setup.exe" -Force

          Get-Item "Output/SystemInfo-Setup.exe" | Select-Object FullName, Length

      - name: Verify packaged app has no orphaned dev paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Guards against the exact failure mode spec section 43 calls
          # out: a tauri.conf.json resources path (or anything else) baking
          # in this runner's absolute checkout path.
          $confPath = "frontend/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw
          if ($conf -match [regex]::Escape($env:GITHUB_WORKSPACE)) {
            Write-Error "$confPath contains an absolute runner path — resource paths must stay relative."
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-Setup
          path: Output/SystemInfo-Setup.exe
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # JOB 3 — Linux build. Runs in PARALLEL with build-windows (both only
  # depend on `version`, not on each other) — order between them no
  # longer matters at all.
  #
  # This mirrors build-windows: the Tauri desktop shell, not a shell
  # script pretending localhost is a UI, owns the production packaging
  # on Linux too. start-all.sh / packaging/linux/AppRun+systeminfo.desktop
  # were the old "dev script wearing a fake moustache" approach (they
  # ran `dotnet run` / `npm run dev` / bare `uvicorn` straight from
  # /opt/systeminfo, needed sudo to create /opt/systeminfo/logs, and
  # required a system-wide uvicorn install) — replaced here by the same
  # self-contained backend publish + PyInstaller analytics freeze +
  # `tauri build` pipeline the Windows job already uses, just targeting
  # linux-x64 and the deb/appimage bundlers instead of nsis. Those two
  # legacy files are still used for pre-Tauri manual dev testing and are
  # not part of the production build anymore.
  # ============================================================
  # ============================================================
  # JOB 3 — Linux build.
  # ============================================================
  build-linux:
    needs: version
    if: needs.version.outputs.skip != 'true'
    # Pin to ubuntu-22.04: Ubuntu 24.04 breaks linuxdeploy (AppArmor unprivileged
    # userns restrictions) and produces AppImages with Glibc 2.39+ that fail on older distros.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('backend/SystemMonitor.Api/*.csproj') }}
          restore-keys: |
            nuget-linux-

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build (frontend/src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Sync application version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          node scripts/sync-version.mjs "$APP_VERSION"
          node scripts/check-version.mjs

      - name: Install build tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            nasm cmake build-essential file libfuse2 \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libssl-dev

      - name: Build native C++ engine
        shell: bash
        run: |
          set -e
          mkdir -p native/build
          bash native/build.sh

      - name: Restore backend
        shell: bash
        run: |
          set -e
          dotnet restore backend/SystemMonitor.Api

      - name: Publish backend (self-contained linux-x64)
        shell: bash
        run: |
          set -e

          if [ -d "build/backend" ]; then rm -rf "build/backend"; fi
          mkdir -p "build/backend"

          dotnet publish backend/SystemMonitor.Api \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --no-restore \
            --output build/backend

          BACKEND_BIN="build/backend/SystemMonitor.Api"
          if [ ! -f "$BACKEND_BIN" ]; then
            echo "::error::Published backend executable was not created: $BACKEND_BIN"
            exit 1
          fi
          chmod +x "$BACKEND_BIN"

          NATIVE_LIB="build/backend/libsystemmonitor_native.so"
          if [ ! -f "$NATIVE_LIB" ]; then
            echo "::error::Native library is missing from publish output: $NATIVE_LIB"
            exit 1
          fi

      - name: Install frontend dependencies and build
        working-directory: frontend
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

          if [ ! -d "dist" ]; then
            echo "::error::Frontend dist directory was not created."
            exit 1
          fi

      - name: Install analytics dependencies
        working-directory: analytics
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install fastapi uvicorn
          fi

          if [ -f requirements-build.txt ]; then
            python -m pip install -r requirements-build.txt
          else
            python -m pip install pyinstaller
          fi

      - name: Build analytics binary with PyInstaller
        working-directory: analytics
        shell: bash
        run: |
          set -e

          rm -rf build dist analytics.spec

          python -m PyInstaller --onefile --clean --noconfirm --name analytics \
            --collect-submodules uvicorn \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.loops.asyncio \
            run_analytics.py

          if [ ! -f "dist/analytics" ]; then
            echo "::error::PyInstaller did not create the analytics binary."
            exit 1
          fi
          chmod +x dist/analytics

      - name: Stage backend and analytics as Tauri resources
        shell: bash
        run: |
          set -e

          BACKEND_DEST="frontend/src-tauri/resources/backend"
          ANALYTICS_DEST="frontend/src-tauri/resources/analytics"

          rm -rf "$BACKEND_DEST" "$ANALYTICS_DEST"
          mkdir -p "$BACKEND_DEST" "$ANALYTICS_DEST"

          cp -r build/backend/* "$BACKEND_DEST/"
          cp analytics/dist/analytics "$ANALYTICS_DEST/analytics"
          chmod +x "$BACKEND_DEST/SystemMonitor.Api" "$ANALYTICS_DEST/analytics"

      - name: Validate Tauri resource staging
        shell: bash
        run: |
          set -e

          required_files=(
            "frontend/src-tauri/resources/backend/SystemMonitor.Api"
            "frontend/src-tauri/resources/backend/libsystemmonitor_native.so"
            "frontend/src-tauri/resources/analytics/analytics"
            "frontend/src-tauri/icons/icon.png"
          )

          for f in "${required_files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Required Tauri resource is missing or empty: $f"
              exit 1
            fi
          done

          echo "Tauri resource staging validated."

      - name: Install Tauri CLI
        working-directory: frontend
        shell: bash
        run: |
          set -e
          npx tauri --version

      - name: Build Tauri application and installers
        working-directory: frontend
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          set -e
          npx tauri build

      - name: Locate and verify deb and AppImage packages
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          mkdir -p Output

          DEB=$(find frontend/src-tauri/target/release/bundle/deb -name "*.deb" | head -n1)
          if [ -z "$DEB" ]; then
            echo "::error::No .deb package was produced under frontend/src-tauri/target/release/bundle/deb."
            exit 1
          fi
          cp "$DEB" "Output/systeminfo_${VERSION}_amd64.deb"

          APPIMAGE=$(find frontend/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No .AppImage was produced under frontend/src-tauri/target/release/bundle/appimage."
            exit 1
          fi
          cp "$APPIMAGE" "Output/SystemInfo-${VERSION}-x86_64.AppImage"

          ls -la Output/

      - name: Verify packaged app has no orphaned dev paths
        shell: bash
        run: |
          set -e
          conf="frontend/src-tauri/tauri.conf.json"
          if grep -qF "$GITHUB_WORKSPACE" "$conf"; then
            echo "::error::$conf contains an absolute runner path — resource paths must stay relative."
            exit 1
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-AppImage
          path: Output/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemInfo-deb
          path: Output/*.deb
          if-no-files-found: error
          retention-days: 30
  # ============================================================
  # JOB 4 — Release. `needs: [build-windows, build-linux]` means this
  # ONLY runs if BOTH succeeded — GitHub Actions skips it automatically
  # otherwise, no polling, no manual status checks, no "one finished but
  # not the other" gap. Order between the two builds is irrelevant.
  #
  # Tag + release are created together, atomically, by
  # softprops/action-gh-release: if the tag doesn't exist yet, this
  # single step creates it (pointing at this exact commit) AND publishes
  # the release in one call — no separate git-tag-then-push race.
  # ============================================================
  release:
    needs: [version, build-windows, build-linux]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-Setup
          path: release-assets

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-AppImage
          path: release-assets

      - name: Download Linux deb artifact
        uses: actions/download-artifact@v4
        with:
          name: SystemInfo-deb
          path: release-assets

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -e

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "SystemInfo $VERSION" > release-notes.md
            echo "" >> release-notes.md
            echo "Release $VERSION." >> release-notes.md
          fi

          cat release-notes.md

      - name: Create GitHub release (creates the tag automatically)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: SystemInfo ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/SystemInfo-Setup.exe
            release-assets/*.AppImage
            release-assets/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -e
